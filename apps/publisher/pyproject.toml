[project]
name = "fanqie-publisher"
version = "0.2.0"
description = "番茄发布服务：账号登录态、作品扫描、章节发布与编辑"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "playwright>=1.48",
  "httpx>=0.27",
  "psutil>=6.0",
  "mcp>=2.3,<3",
]

[project.scripts]
fanqie-publisher = "fanqie_publisher.__main__:main"
fanqie-publisher-mcp = "fanqie_publisher.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fanqie_publisher"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
